# nginx site for maths-test.andriybabiy.com on the shared Hetzner VPS.
#
# Matches the existing tenant pattern (studyie, movie-generator, teamwork-board, …):
#   - TLS terminated here with the shared Cloudflare Origin Certificate
#     covering *.andriybabiy.com, already at /etc/nginx/andriybabiy-origin.*
#   - Cloudflare proxy must be ON (orange cloud) with SSL mode "Full (Strict)".
#   - Installed at /etc/nginx/conf.d/ (the only include path nginx.conf uses).
#
# One-time install (needs real root — `deploy` user can't sudo cp):
#   # as root:
#   cp /home/deploy/maths-test/apps/web/deploy/nginx/maths-test.andriybabiy.com.conf \
#      /etc/nginx/conf.d/maths-test.andriybabiy.com.conf
#   chown deploy:deploy /etc/nginx/conf.d/maths-test.andriybabiy.com.conf
#   nginx -t && systemctl reload nginx
#
# After the chown, subsequent edits work entirely on the deploy user's
# NOPASSWD whitelist (`sudo nginx -t && sudo systemctl reload nginx`)
# — no further root work needed.

server {
    listen 80;
    listen [::]:80;
    server_name maths-test.andriybabiy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maths-test.andriybabiy.com;

    # Shared Cloudflare Origin Cert covers *.andriybabiy.com — 15-year
    # validity, no certbot renewal needed. Same paths as the other tenants.
    ssl_certificate     /etc/nginx/andriybabiy-origin.pem;
    ssl_certificate_key /etc/nginx/andriybabiy-origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Diagnostic responses can carry a few hundred KB of latex+SVG, but
    # nothing bigger — keep this tight.
    client_max_body_size 2M;

    # /api/assessment proxies to the in-process LangGraph agent which calls
    # OpenRouter for short LLM commentary. Don't 504 a turn that runs a long
    # tool chain (some Rasch updates touch the bank twice).
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Harmless today; future-proofs for any websocket usage. Relies on
        # the $connection_upgrade map already declared by studyie.conf at
        # http{} level — do NOT redeclare it here.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    access_log /var/log/nginx/maths-test.andriybabiy.access.log;
    error_log  /var/log/nginx/maths-test.andriybabiy.error.log warn;
}
