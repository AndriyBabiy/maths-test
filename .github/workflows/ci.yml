name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: core (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is picked up from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck core
        run: pnpm --filter @maths-diag/core run build

      - name: Test core
        run: pnpm --filter @maths-diag/core run test

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is picked up from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Web typechecks against the compiled `dist/` of @maths-diag/core,
      # so build the workspace dep first.
      - name: Build core (workspace dep)
        run: pnpm --filter @maths-diag/core run build

      - name: Typecheck web
        run: pnpm --filter web run typecheck

      - name: Build web
        run: pnpm --filter web run build
        env:
          OPENROUTER_API_KEY: placeholder

  # No deploy job — production deploys are run manually from a laptop via
  # scripts/deploy.sh. Keeps the SSH key out of GitHub Actions and prevents
  # a green CI run from auto-rolling a regression onto prod.
